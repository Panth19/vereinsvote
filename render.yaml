# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# Creates a Docker web service plus a PostgreSQL database. Check Render's
# current pricing page: free web services sleep when idle, and free databases
# expire after a limited time.
services:
  - type: web
    name: vereinsvote
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vereinsvote-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # set to your Render URL, e.g. https://vereinsvote.onrender.com
      - key: SEED_DEMO_DATA
        value: 'true'

databases:
  - name: vereinsvote-db
    plan: free
    databaseName: vereinsvote
    user: vereinsvote
